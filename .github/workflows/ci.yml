name: Orbital Command CI

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

jobs:
    build-and-lint:
        name: Compilación y Adutoría de Código
        runs-on: ubuntu-latest

        steps:
            - name: Descargar el repositorio
              uses: actions/checkout@v4

            - name: Configurar Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Instalar Dependencias
              run: npm ci

            # - name: Auditoría de Sintaxis (ESLint)
            #   run: npm run lint

            - name: Prueba de Compilación (Vite Build)
              run: npm run build

    testing:
        name: Pruebas Unitarias y E2E
        needs: build-and-lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Instalar dependencias
              run: npm ci

            - name: Pruebas Unitarias
              run: npm run test:unit

            - name: Pruebas End-to-End
              uses: cypress-io/github-action@v6
              with:
                  build: npm run build
                  start: npm run preview -- --host 127.0.0.1
                  wait-on: 'http://127.0.0.1:4173'
                  config: baseUrl=http://127.0.0.1:4173
